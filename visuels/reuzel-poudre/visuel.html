<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:var(--H);background:#111;color:#fff;overflow:hidden;font-family:'Work Sans',sans-serif}
.kicker{position:absolute;left:60px;display:flex;align-items:center;gap:24px;font-family:Oswald;font-weight:600;font-size:32px;letter-spacing:.22em}
.kicker::before{content:"";width:76px;height:5px;background:#c0262d}
h1{position:absolute;left:60px;font-family:Oswald;font-weight:700;font-size:100px;line-height:1.0;text-transform:uppercase;letter-spacing:.005em}
.sous{position:absolute;left:62px;font-size:27px;color:#cfcfcf}
.produit{position:absolute;filter:drop-shadow(0 30px 40px rgba(0,0,0,.7))}
.grille{position:absolute;left:60px;right:60px;display:grid;grid-template-columns:1fr 1fr;column-gap:48px}
.item{border-top:2px solid #2b2b2b;padding:30px 0 30px;display:grid;grid-template-columns:82px 1fr}
.num{font-family:Oswald;font-weight:600;font-size:36px;color:#6b6b6b;line-height:1.1}
.item b{display:block;font-family:Oswald;font-weight:600;font-size:36px;line-height:1.1;text-transform:uppercase;margin-bottom:10px}
.item p{font-size:23px;line-height:1.55;color:#cfcfcf}
.cta{position:absolute;left:40px;right:40px;bottom:24px;height:100px;background:#fff;color:#111;display:flex;align-items:center;justify-content:space-between;padding:0 40px}
.cta .g{font-family:Oswald;font-weight:600;font-size:40px;letter-spacing:.12em}
.cta .d{font-family:Oswald;font-weight:600;font-size:38px}
</style></head><body>
<div id="c"></div>
<script>
const story=new URLSearchParams(location.search).get('f')==='story';
document.documentElement.style.setProperty('--H',(story?1920:1350)+'px');
const items=[
 ['Volume et épaisseur','Donne du corps et de l’épaisseur à tous les types de cheveux.'],
 ['Un fini complètement mat','Formule légère et non collante. Aucun effet mouillé ni brillant.'],
 ['Tient toute la journée','Ta coiffure reste en place du matin au soir, sans retouche.'],
 ['Une pincée suffit','Applique à la racine, frotte du bout des doigts et laisse le volume faire son effet.']];
const grille=top=>`<div class="grille" style="top:${top}px">${items.map((it,i)=>`<div class="item"><div class="num">0${i+1}</div><div><b>${it[0]}</b><p>${it[1]}</p></div></div>`).join('')}</div>`;
const cta=`<div class="cta"><span class="g">RÉSERVEZ EN LIGNE</span><span class="d">vraigentleman.ca</span></div>`;
document.getElementById('c').innerHTML = story ? `
 <div class="kicker" style="top:120px">EN VENTE AU SALON</div>
 <h1 style="top:186px;font-size:112px">Du volume.<br>Sans effet<br>collant.</h1>
 <p class="sous" style="top:540px;font-size:30px">Reuzel Matte Texture Powder, 15 g.</p>
 <img class="produit" src="produit-detoure.png" style="left:50%;transform:translateX(-50%);top:630px;height:580px">
 ${grille(1250)}
 ${cta.replace('class="cta"','class="cta" style="bottom:110px"')}` : `
 <div class="kicker" style="top:66px">EN VENTE AU SALON</div>
 <h1 style="top:132px">Du volume.<br>Sans effet<br>collant.</h1>
 <p class="sous" style="top:470px">Reuzel Matte Texture Powder, 15 g.</p>
 <img class="produit" src="produit-detoure.png" style="left:735px;top:58px;height:600px">
 ${grille(690)}
 ${cta}`;
</script></body></html>
